server {
    listen 80;
    server_name localhost;

    # 允许上传最大 500MB（测试管理制度文件上传场景）
    client_max_body_size 500m;

    # 隐藏 nginx 版本（信息泄漏）
    server_tokens off;

    # 安全响应头（防 MIME 嗅探、点击劫持、降级引用等）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # gzip 压缩（静态资源从 620KB 降到 ~200KB）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # AI 审核含 GLM/MiniMax 调用（大文档可能 120s+），给 180s 余量
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        charset utf-8;
    }

    # index.html 必须每次都重新验证（否则浏览器会缓存旧版，
    # 旧 index.html 引用了已被覆盖的旧 hash JS，导致 404）
    # 注意：子 location 里的 add_header 会覆盖父级所有 add_header（nginx 设计），
    # 因此这里需要重复声明 server 级的安全头，否则会丢失。
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 静态资源（带 hash 文件名）长期缓存
    # - 文件名包含 hash，文件内容变化时文件名也变
    # - immutable 表示内容不会变，浏览器可以放心缓存
    location /assets {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
