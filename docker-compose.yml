version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: test_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      TZ: Asia/Shanghai
    # 仅绑定本机，不暴露到公网
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # 仅绑定本机，前端 Nginx 通过 Docker 内部网络代理 /api/
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 不挂载 ./scripts，避免覆盖 Dockerfile COPY 进去的 resource_plan.py
      # 原来有 - ./scripts:/app/scripts:ro（删掉，会让容器内 scripts 变 deploy.sh/init.sql，缺 resource_plan.py）
      # 学习纠错库持久化（自学习能力）
      - ./data:/app/data
      # 测试管理制度文件上传持久化
      - ./uploads:/app/uploads
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=test_platform
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - TZ=Asia/Shanghai
      # 飞书 OAuth 登录配置
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_REDIRECT_URI=${FEISHU_REDIRECT_URI:-}
      - FRONTEND_HOME=${FRONTEND_HOME:-/}
      - FEISHU_DEFAULT_ROLE=${FEISHU_DEFAULT_ROLE:-阅读者}
      - FEISHU_DEPT_ROLE_MAP=${FEISHU_DEPT_ROLE_MAP:-[]}
      - FEISHU_ENABLED=${FEISHU_ENABLED:-true}
      - FEISHU_FETCH_DEPT=${FEISHU_FETCH_DEPT:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
    driver: local
