version: '3.8'

# 三个服务共用的日志轮转。不设上限的话容器日志（json-file）会无限增长，公网机器上 nginx 访问日志
# 还会持续被扫描流量刷大，最终挤占磁盘——连带影响数据库写入和上传
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: test_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      TZ: Asia/Shanghai
    # 仅绑定本机，不暴露到公网
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # 走 TCP 探测：镜像首次初始化数据目录期间有个只开 Unix socket 的临时实例，
      # 默认的 socket 探测会在那 1~2 秒里提前判“就绪”，后端随之启动却连不上库
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d test_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # 仅绑定本机，前端 Nginx 通过 Docker 内部网络代理 /api/
    logging: *default-logging
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 不挂载 ./scripts，避免覆盖 Dockerfile COPY 进去的 resource_plan.py
      # 原来有 - ./scripts:/app/scripts:ro（删掉，会让容器内 scripts 变 deploy.sh/init.sql，缺 resource_plan.py）
      # 学习纠错库持久化（自学习能力）
      - ./data:/app/data
      # 故障日志抓取：宿主层采集的组件日志（只读，供快照聚合）
      - ./backups/syslogs:/app/syslogs:ro
      # 测试管理制度文件上传持久化
      - ./uploads:/app/uploads
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=test_platform
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      # 报告审核的模型与思考强度（不设则用代码默认值 glm-5.2 / low）
      - REPORT_REVIEW_MODEL=${REPORT_REVIEW_MODEL:-}
      - REPORT_REVIEW_EFFORT=${REPORT_REVIEW_EFFORT:-}
      # 知识库向量检索（调按量计费的 embedding-3）：设 on 开启；不设则知识检索只用关键词
      - KB_VECTOR_RETRIEVAL=${KB_VECTOR_RETRIEVAL:-}
      # 跨域白名单（逗号分隔的完整来源）。不设 = 拒绝所有跨域请求，同源访问不受影响
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # AI 用量限额（不设则用代码默认：每日 1.1 亿 token / 每周 6 万积分 / 1 积分 = 9166.67 token）
      - AI_DAILY_TOKEN_LIMIT=${AI_DAILY_TOKEN_LIMIT:-}
      - AI_WEEKLY_POINT_LIMIT=${AI_WEEKLY_POINT_LIMIT:-}
      - AI_POINT_TOKENS=${AI_POINT_TOKENS:-}
      # 以下为对比实验/调参用的临时开关，平时留空即代码默认值
      - KB_DEEP_MODEL=${KB_DEEP_MODEL:-}
      - DRAWING_REVIEW_MODEL=${DRAWING_REVIEW_MODEL:-}
      - DRAWING_REVIEW_EFFORT=${DRAWING_REVIEW_EFFORT:-}
      - DRAWING_REVIEW_MAX_TOKENS=${DRAWING_REVIEW_MAX_TOKENS:-}
      - DRAWING_REVIEW_TIMEOUT_MS=${DRAWING_REVIEW_TIMEOUT_MS:-}
      - DRAWING_REVIEW_DUMP_DIR=${DRAWING_REVIEW_DUMP_DIR:-}
      - DRAWING_REVIEW_STREAM=${DRAWING_REVIEW_STREAM:-}
      - TZ=Asia/Shanghai
      # 飞书 OAuth 登录配置
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_REDIRECT_URI=${FEISHU_REDIRECT_URI:-}
      - FRONTEND_HOME=${FRONTEND_HOME:-/}
      - FEISHU_DEFAULT_ROLE=${FEISHU_DEFAULT_ROLE:-阅读者}
      - FEISHU_DEPT_ROLE_MAP=${FEISHU_DEPT_ROLE_MAP:-[]}
      # 飞书登录是否开启由上面三个变量是否齐全决定（代码里据此推导）；没有单独的开关变量
      - FEISHU_FETCH_DEPT=${FEISHU_FETCH_DEPT:-false}
      # 只读状态接口 token（外部监控探活用）
      - STATUS_TOKEN=${STATUS_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    logging: *default-logging
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
    driver: local
